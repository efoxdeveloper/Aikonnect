<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>NTT package checkout example</title>
<h1>Pay ₹10</h1>
<button id="pay">Open checkout</button>
<div id="mock" hidden>Sandbox result:
  <button data-status="SUCCESS">Success</button>
  <button data-status="PENDING">Pending</button>
  <button data-status="FAILED">Failure</button>
</div>
<pre id="result"></pre>
<script type="module">
import { openCheckout } from '/checkout.js';
const output=document.querySelector('#result');
document.querySelector('#pay').onclick=async()=>{
  try {
    const response=await fetch('/payments',{method:'POST'});
    const data=await response.json();
    if(!response.ok) throw new Error(data.error+' ('+(data.requestId??'')+')');
    output.textContent=JSON.stringify(data.payment,null,2);
    if(data.payment.checkout.environment==='MOCK') document.querySelector('#mock').hidden=false;
    else await openCheckout({checkout:data.payment.checkout,customer:data.customer});
  } catch(error) { output.textContent=error.message; }
};
for(const button of document.querySelectorAll('[data-status]')) button.onclick=async()=>{
  const response=await fetch('/simulate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({status:button.dataset.status})});
  output.textContent=JSON.stringify(await response.json(),null,2);
};
</script>
</html>
